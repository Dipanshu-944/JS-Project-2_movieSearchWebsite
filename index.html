<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Hub</title>

    <link rel="stylesheet" href="./output.css" />
  </head>

  <body class="min-h-screen bg-[#080808] text-white">
    <div
      class="min-h-screen bg-cover bg-center bg-fixed"
      style="
        background-image:
          linear-gradient(rgba(5, 5, 5, 0.92), rgba(5, 5, 5, 0.96)),
          url(&quot;https://images.unsplash.com/photo-1489599849927-2ee91cede3ba&quot;);
      "
    >
      
      <header class="text-center pt-10 px-5">
        <h1 class="text-4xl md:text-6xl font-black tracking-[6px] text-red-500">
          MOVIE HUB
        </h1>

        <p class="mt-3 text-xs md:text-sm tracking-[5px] text-green-400">
          DISCOVER • SEARCH • WATCH
        </p>
      </header>

      
      <div class="flex justify-center mt-10 px-5">
        <form
          id="movieForm"
          class="flex flex-col sm:flex-row gap-3 w-full max-w-2xl"
        >
          <input
            id="movieInput"
            type="text"
            placeholder="Search Movie Title"
            class="flex-1 px-5 py-4 rounded-lg bg-black/70 border-2 border-red-800 outline-none text-white placeholder-gray-500 focus:border-green-400 focus:ring-2 focus:ring-green-400/20"
          />

          <button
            type="submit"
            class="px-8 py-4 rounded-lg bg-yellow-400 text-black font-bold hover:bg-yellow-300 hover:-translate-y-1 transition"
          >
            Search
          </button>
        </form>
      </div>

      
      <div
        id="movieHub"
        class="w-[92%] max-w-7xl mx-auto mt-12 pb-16 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5"
      ></div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
